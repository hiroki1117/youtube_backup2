name: tfaction apply

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/tfaction-*.yml'
      - 'tfaction-root.yaml'
      - 'aqua/aqua.yaml'
  workflow_dispatch:
    inputs:
      working_directory:
        description: 'Working directory to apply (e.g., infra/aws)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup aqua
        uses: aquaproj/aqua-installer@v3.0.1
        with:
          aqua_version: v2.36.1
          working_directory: aqua

      - name: Setup Terraform
        run: terraform version

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: tfaction list
        id: list
        run: |
          if [ -n "${{ github.event.inputs.working_directory }}" ]; then
            echo "${{ github.event.inputs.working_directory }}" | tee changed_targets.txt
          else
            tfaction list --changed | tee changed_targets.txt
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: tfaction apply
        run: |
          while IFS= read -r target; do
            echo "Applying: $target"
            tfaction apply --working-directory "$target"
          done < changed_targets.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_REGION: ap-northeast-1
